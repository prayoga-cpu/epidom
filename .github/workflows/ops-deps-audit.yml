name: Ops — Dependency Vulnerability Audit

# Runs pnpm audit against the production dependency tree.
# Opens a GitHub issue if HIGH or CRITICAL advisories are found.
# Can be run on demand or scheduled weekly.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

jobs:
  audit:
    name: pnpm audit --prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run audit
        id: audit
        run: |
          pnpm audit --prod --json > audit-report.json 2>&1 || true
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit-report.json 2>/dev/null || echo 0)
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' audit-report.json 2>/dev/null || echo 0)
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "High: $HIGH  Critical: $CRITICAL"
          cat audit-report.json | jq '.advisories // {}' 2>/dev/null || true

      - name: Open GitHub issue if HIGH/CRITICAL found
        if: steps.audit.outputs.high != '0' || steps.audit.outputs.critical != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const high = ${{ steps.audit.outputs.high }};
            const critical = ${{ steps.audit.outputs.critical }};
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security: ${critical} critical, ${high} high vulnerabilities in npm deps`,
              body: [
                '## Dependency vulnerability audit',
                '',
                `Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                `| Severity | Count |`,
                `|----------|-------|`,
                `| Critical | ${critical} |`,
                `| High     | ${high} |`,
                '',
                'Run `pnpm audit --prod` locally to see the full report and `pnpm audit --fix` to auto-upgrade where possible.',
              ].join('\n'),
              labels: ['security', 'dependencies'],
            });
